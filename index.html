<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY PRECIOUS MEMORIES</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}
header{text-align:center;padding:25px;color:#d5b46b}
h1{letter-spacing:3px;font-size:25px}
.container{max-width:600px;margin:auto;padding:18px}
.card{background:#151515;border:1px solid #a98a4d;border-radius:14px;padding:20px;margin:18px 0}
input,button{width:100%;padding:13px;margin:8px 0;border-radius:8px;font-size:15px}
input{background:#222;color:white;border:1px solid #555}
button{background:#b49352;color:#080808;font-weight:bold;border:0;cursor:pointer}
button.secondary{background:#292929;color:#d5b46b;border:1px solid #a98a4d}
.small{font-size:13px;color:#aaa}
#gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:#222;padding:8px;border-radius:10px;overflow:hidden}
.item img,.item video{width:100%;height:150px;object-fit:cover;border-radius:7px}
.item button{font-size:12px;padding:9px}
.hidden{display:none}
.gold{color:#d5b46b}
</style>
</head>

<body>
<header>
<h1>MY PRECIOUS MEMORIES</h1>
<p class="gold">Your Private World of Memories</p>
</header>

<div class="container">

<div class="card" id="loginBox">
<h2 class="gold">Welcome Back ❤️</h2>
<input id="email" type="email" placeholder="Your Email">
<input id="password" type="password" placeholder="Password">
<button id="loginButton">LOGIN</button>
<p class="small" id="message"></p>
</div>

<div id="app" class="hidden">

<div class="card">
<h2 class="gold">Your Memories</h2>
<p>Welcome to your private gallery.</p>
<input type="file" id="files" accept="image/*,video/*" multiple>
<button id="uploadButton">UPLOAD MEMORIES</button>
<p id="status" class="small"></p>
</div>

<div class="card">
<h3 class="gold">Your Gallery</h3>
<div id="gallery"></div>
</div>

<div class="card">
<h3 class="gold">Your Private Gallery</h3>
<button class="secondary" id="refreshButton">REFRESH</button>
<button id="logoutButton">LOCK & LOGOUT 🔒</button>
</div>

</div>
</div>

<script>
const SUPABASE_URL = "https://jrvoblexequibhavjjpv.supabase.co";
const SUPABASE_KEY = "sb_publishable_-YVKtvimONR8A2Wt6YjQgw_jOurif6J";
const BUCKET = "PRECIOUS MEMORIES";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;

const $ = id => document.getElementById(id);

function msg(text) {
  $("message").textContent = text;
}

function showLogin() {
  $("loginBox").classList.remove("hidden");
  $("app").classList.add("hidden");
}

function showApp() {
  $("loginBox").classList.add("hidden");
  $("app").classList.remove("hidden");
}

async function login() {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    msg("Enter your email and password.");
    return;
  }

  $("loginButton").disabled = true;
  msg("Logging in...");

  const {data, error} = await db.auth.signInWithPassword({
    email,
    password
  });

  $("loginButton").disabled = false;

  if (error) {
    msg(error.message);
    return;
  }

  currentUser = data.user;
  showApp();
  await loadGallery();
}

async function uploadFiles() {
  const files = $("files").files;
  const status = $("status");

  if (!currentUser) {
    status.textContent = "Please login first.";
    return;
  }

  if (!files.length) {
    status.textContent = "Select photos or videos first.";
    return;
  }

  status.textContent = "Uploading...";

  for (const file of files) {
    const safeName =
      Date.now() + "-" +
      file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    const path = currentUser.id + "/" + safeName;

    const {error} = await db.storage
      .from(BUCKET)
      .upload(path, file, {upsert: false});

    if (error) {
      status.textContent = "Upload failed: " + error.message;
      return;
    }
  }

  status.textContent = "Upload completed!";
  $("files").value = "";
  await loadGallery();
}

async function loadGallery() {
  const gallery = $("gallery");
  gallery.innerHTML = "Loading memories...";

  if (!currentUser) {
    gallery.innerHTML = "";
    return;
  }

  const {data, error} = await db.storage
    .from(BUCKET)
    .list(currentUser.id, {limit: 100});

  if (error) {
    gallery.textContent = "Gallery error: " + error.message;
    return;
  }

  gallery.innerHTML = "";

  const files = (data || []).filter(file => file.name);

  if (!files.length) {
    gallery.textContent = "No memories uploaded yet.";
    return;
  }

  for (const file of files) {
    const path = currentUser.id + "/" + file.name;

    const {data: urlData, error: urlError} =
      await db.storage.from(BUCKET).createSignedUrl(path, 300);

    if (urlError) continue;

    const url = urlData.signedUrl;
    const isVideo = /\.(mp4|mov|webm|m4v)$/i.test(file.name);

    const item = document.createElement("div");
    item.className = "item";

    const media = document.createElement(isVideo ? "video" : "img");
    media.src = url;

    if (isVideo) {
      media.controls = true;
      media.preload = "metadata";
    } else {
      media.loading = "lazy";
    }

    const download = document.createElement("button");
    download.textContent = "DOWNLOAD";
    download.onclick = () => {
      const a = document.createElement("a");
      a.href = url;
      a.download = file.name;
      a.target = "_blank";
      a.click();
    };

    const del = document.createElement("button");
    del.className = "secondary";
    del.textContent = "DELETE";

    del.onclick = async () => {
      if (!confirm("Delete this memory?")) return;

      const {error: deleteError} = await db.storage
        .from(BUCKET)
        .remove([path]);

      if (deleteError) {
        alert(deleteError.message);
      } else {
        await loadGallery();
      }
    };

    item.append(media, download, del);
    gallery.appendChild(item);
  }
}

async function logout() {
  await db.auth.signOut();
  currentUser = null;
  $("password").value = "";
  $("gallery").innerHTML = "";
  showLogin();
  msg("Gallery locked.");
}

$("loginButton").addEventListener("click", login);
$("uploadButton").addEventListener("click", uploadFiles);
$("refreshButton").addEventListener("click", loadGallery);
$("logoutButton").addEventListener("click", logout);

async function initialize() {
  const {data, error} = await db.auth.getSession();

  if (error) {
    msg(error.message);
    return;
  }

  if (data.session) {
    currentUser = data.session.user;
    showApp();
    await loadGallery();
  } else {
    showLogin();
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    currentUser = null;
    showLogin();
  }
});

initialize();
</script>
</body>
</html>
